data:
  raw_dir: "data/raw"
  dataset_name: "mohanty/PlantVillage"
  dataset_config: "color"
  image_size: 224
  batch_size: 32
  num_workers: 4
  val_split_from_train: 0.15
  split_seed: 42
  use_class_weights: false
  use_weighted_sampler: false

training:
  epochs: 20
  learning_rate: 1e-4
  weight_decay: 1e-5
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  loss_fn: "CrossEntropyLoss"
  early_stopping_patience: 7

  use_mixstyle: false
  mixstyle_prob: 0.5
  mixstyle_layers: [0, 2, 4]

  augmentation_level: "standard"
  aggressive_augmentation: false

  use_adain: false
  adain_prob: 0.3

logging:
  log_dir: "experiments/results/logs_v2"
  checkpoint_dir: "experiments/results/checkpoints_v2"
  plot_dir: "experiments/results/plots_v2"
  save_epoch_checkpoints: false

speed:
  cudnn_benchmark: true
  mixed_precision: true
  compile: false
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true

adaptation:
  use_adabn: false
  adabn_passes: 1
  use_shot: false
  shot_epochs: 10
  shot_lr: 1e-5
  use_shot_with: "lora"

version: 2
